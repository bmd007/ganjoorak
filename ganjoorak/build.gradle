plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.11.5'
	id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'io.github.bmd007.poem'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

ext {
	set('springAiVersion', '2.0.0-M4')
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

node {
	download = false
	nodeProjectDir = file('frontend')
}

sourceSets {
	main {
		resources {
			srcDir layout.buildDirectory.dir('frontend')
		}
	}
}

tasks.named('npm_run_build') {
	inputs.dir('frontend/src')
	inputs.file('frontend/vite.config.js')
	inputs.file('frontend/index.html')
	outputs.dir(layout.buildDirectory.dir('frontend/static'))
}

tasks.named('processResources') {
	dependsOn 'npm_run_build'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
